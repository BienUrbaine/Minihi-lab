name: Inspect ANAH source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-anah.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download current ANAH GeoJSON
        run: |
          curl -L --fail --retry 3 \
            'https://www.data.gouv.fr/api/1/datasets/r/1631e896-9670-4db8-92c9-35d6a0daa032' \
            -o /tmp/anah.geojson
          ls -lh /tmp/anah.geojson
      - name: Inspect schema and Brittany-related values
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          p='/tmp/anah.geojson'
          with open(p, encoding='utf-8') as f:
              data=json.load(f)
          fs=data.get('features',[])
          print('features', len(fs))
          if not fs:
              raise SystemExit('No features')
          props=fs[0].get('properties') or {}
          print('keys', sorted(props.keys()))
          print('sample', json.dumps(props, ensure_ascii=False, indent=2)[:12000])
          # Print likely field distributions for inspection
          keys=set().union(*[(f.get('properties') or {}).keys() for f in fs[:500]])
          for k in sorted(keys):
              lk=k.lower()
              if any(t in lk for t in ['depart','region','date','etat','statut','maitre','operat','type','label','nom']):
                  vals=Counter(str((f.get('properties') or {}).get(k)) for f in fs)
                  print('\nFIELD', k, 'TOP', vals.most_common(20))
          PY
