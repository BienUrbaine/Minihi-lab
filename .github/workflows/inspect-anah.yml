name: Inspect generated ANAH data

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-anah.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect generated Brittany file
        run: |
          python - <<'PY'
          import json
          from collections import Counter, defaultdict
          with open('data/perimetres.geojson', encoding='utf-8') as f:
              data=json.load(f)
          fs=data.get('features', [])
          codes=Counter(str((f.get('properties') or {}).get('Code') or '') for f in fs)
          dupes={k:v for k,v in codes.items() if k and v>1}
          print('features', len(fs))
          print('unique_codes', len([k for k in codes if k]))
          print('duplicate_codes', dupes)
          by=defaultdict(list)
          for f in fs:
              p=f.get('properties') or {}
              c=str(p.get('Code') or '')
              if c in dupes:
                  g=f.get('geometry') or {}
                  by[c].append({
                      'Label': p.get('Label'),
                      'Type': p.get('Type'),
                      'Departement': p.get('Departement'),
                      'Operateur': p.get('Operateur'),
                      'geometry_type': g.get('type'),
                      'has_coordinates': bool(g.get('coordinates')),
                  })
          print(json.dumps(by, ensure_ascii=False, indent=2))
          PY
