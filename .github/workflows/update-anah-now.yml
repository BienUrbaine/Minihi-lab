name: Update ANAH Brittany perimeters

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-anah-now.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate Brittany ANAH perimeters
        run: python scripts/update_anah_perimeters.py
      - name: Validate output
        run: |
          python - <<'PY'
          import json
          p='data/perimetres.geojson'
          with open(p, encoding='utf-8') as f:
              d=json.load(f)
          assert d.get('type') == 'FeatureCollection'
          assert isinstance(d.get('features'), list) and d['features']
          allowed={'22','29','35','56'}
          deps={str(f.get('properties',{}).get('Departement')) for f in d['features']}
          assert deps <= allowed, deps
          print('GeoJSON valide :', len(d['features']), 'opérations ; départements', sorted(deps))
          PY
      - name: Commit generated perimeter data
        run: |
          if git diff --quiet -- data/perimetres.geojson; then
            echo 'Aucune modification de perimetres.geojson'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/perimetres.geojson
          git commit -m 'Étend les périmètres ANAH actifs à toute la Bretagne'
          git push
