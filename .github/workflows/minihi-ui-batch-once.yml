name: Minihi UI batch once

on:
  push:
    paths:
      - ".github/workflows/minihi-ui-batch-once.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Apply targeted Minihi changes
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import urlopen
          import json

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"Motif introuvable pour {label}")
              return text.replace(old, new, 1)

          # 1. Contour administratif de la Bretagne, stocké localement.
          boundary_url = "https://geo.api.gouv.fr/regions/53?fields=nom,code,contour&format=geojson&geometry=contour"
          with urlopen(boundary_url, timeout=60) as response:
              boundary = json.load(response)
          if boundary.get("type") != "Feature" or not boundary.get("geometry"):
              raise SystemExit("Contour Bretagne invalide")
          Path("data/bretagne.geojson").write_text(
              json.dumps(boundary, ensure_ascii=False, separators=(",", ":")),
              encoding="utf-8",
          )

          # 2. Symbologie qualitative + masque Bretagne dans Leaflet.
          app_path = Path("app.js")
          app = app_path.read_text(encoding="utf-8")
          app = replace_once(
              app,
              '''const perimeterStyle = {
            stroke: true,
            color: "#8f2f08",
            weight: 1.4,
            opacity: 0.9,
            fillColor: "#c84a0a",
            fillOpacity: 0.52,
          };

          const perimeterHoverStyle = {
            color: "#782300",
            weight: 2,
            fillColor: "#d95712",
            fillOpacity: 0.72,
          };''',
              '''const PERIMETER_STYLES = {
            "OPAH-RU": { color: "#34235f", fillColor: "#46327e" },
            PIG: { color: "#27466e", fillColor: "#365c8d" },
            "OPAH-D": { color: "#147b68", fillColor: "#1fa187" },
            POPAC: { color: "#328c50", fillColor: "#4ac16d" },
          };

          const DEFAULT_PERIMETER_STYLE = { color: "#475159", fillColor: "#66737a" };

          function styleForFeature(feature) {
            const type = String(feature?.properties?.Type || "").trim().toUpperCase();
            const palette = PERIMETER_STYLES[type] || DEFAULT_PERIMETER_STYLE;
            return {
              stroke: true,
              color: palette.color,
              weight: 2,
              opacity: 0.96,
              fillColor: palette.fillColor,
              fillOpacity: 0.2,
            };
          }

          function hoverStyleForFeature(feature) {
            return {
              ...styleForFeature(feature),
              weight: 2.7,
              fillOpacity: 0.34,
            };
          }''',
              "symbologie",
          )
          app = replace_once(
              app,
              ''').setView([47.92, -3.83], 10);''',
              ''').setView([48.2, -2.8], 7);''',
              "vue initiale",
          )
          tile_anchor = '''L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 19,
            attribution:
              '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
          }).addTo(map);

          L.control'''
          tile_replacement = '''L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 19,
            attribution:
              '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
          }).addTo(map);

          map.createPane("regionMaskPane");
          map.getPane("regionMaskPane").style.zIndex = "250";
          map.getPane("regionMaskPane").style.pointerEvents = "none";
          map.createPane("regionOutlinePane");
          map.getPane("regionOutlinePane").style.zIndex = "350";
          map.getPane("regionOutlinePane").style.pointerEvents = "none";

          function outerRingsFromGeometry(geometry) {
            if (!geometry) return [];
            if (geometry.type === "Polygon") return geometry.coordinates.length ? [geometry.coordinates[0]] : [];
            if (geometry.type === "MultiPolygon") {
              return geometry.coordinates
                .filter((polygon) => polygon.length)
                .map((polygon) => polygon[0]);
            }
            return [];
          }

          async function loadBrittanyMask() {
            try {
              const response = await fetch("./data/bretagne.geojson", { cache: "no-store" });
              if (!response.ok) throw new Error("Contour Bretagne indisponible");
              const boundary = await response.json();
              const rings = outerRingsFromGeometry(boundary.geometry).map((ring) =>
                ring.map(([longitude, latitude]) => [latitude, longitude]),
              );
              if (!rings.length) throw new Error("Contour Bretagne vide");

              const worldRing = [
                [-85.05112878, -180],
                [-85.05112878, 180],
                [85.05112878, 180],
                [85.05112878, -180],
                [-85.05112878, -180],
              ];
              L.polygon([worldRing, ...rings], {
                pane: "regionMaskPane",
                interactive: false,
                stroke: false,
                fill: true,
                fillColor: "#59656d",
                fillOpacity: 0.28,
                fillRule: "evenodd",
              }).addTo(map);

              const outline = L.geoJSON(boundary, {
                pane: "regionOutlinePane",
                interactive: false,
                style: {
                  color: "#556169",
                  weight: 1.25,
                  opacity: 0.68,
                  fill: false,
                },
              }).addTo(map);
              if (outline.getBounds().isValid()) {
                map.fitBounds(outline.getBounds(), { padding: [28, 28], maxZoom: 8 });
              }
            } catch (error) {
              console.warn("Masque Bretagne non chargé :", error);
            }
          }

          loadBrittanyMask();

          L.control'''
          app = replace_once(app, tile_anchor, tile_replacement, "masque Bretagne")
          app = replace_once(app, "style: perimeterStyle,", "style: styleForFeature,", "style GeoJSON")
          app = replace_once(app, "layer.setStyle(perimeterHoverStyle);", "layer.setStyle(hoverStyleForFeature(feature));", "survol")
          app = replace_once(app, "layer.setStyle(perimeterStyle);", "layer.setStyle(styleForFeature(feature));", "sortie survol")
          app = app.replace(
              '''    if (perimeterLayer.getBounds().isValid()) {
              map.fitBounds(perimeterLayer.getBounds(), { padding: [28, 28] });
            }
          ''',
              "",
              1,
          )
          app = app.replace(
              '''      if (perimeterLayer.getBounds().isValid()) {
                map.fitBounds(perimeterLayer.getBounds(), { padding: [28, 28] });
              }
          ''',
              "",
              1,
          )
          app_path.write_text(app, encoding="utf-8")

          # 3. MINIHI = retour à l'état initial + légende par type.
          index_path = Path("index.html")
          index = index_path.read_text(encoding="utf-8")
          index = replace_once(
              index,
              '<div class="brand" aria-label="Minihi">MINIHI</div>',
              '<a class="brand" href="./" aria-label="Minihi — revenir à l’accueil">MINIHI</a>',
              "lien Minihi",
          )
          index = replace_once(
              index,
              '<div class="map-legend"><span><i class="legend-zone"></i>Périmètres des dispositifs d’aide</span></div>',
              '''<div class="map-legend" aria-label="Légende des dispositifs">
                <span><i class="legend-swatch legend-opah-ru"></i>OPAH-RU</span>
                <span><i class="legend-swatch legend-pig"></i>PIG</span>
                <span><i class="legend-swatch legend-opah-d"></i>OPAH-D</span>
                <span><i class="legend-swatch legend-popac"></i>POPAC</span>
              </div>''',
              "légende",
          )
          index = index.replace("./app.js?v=20260901-3", "./app.js?v=20260901-4", 1)
          index_path.write_text(index, encoding="utf-8")

          # 4. Ajustements visuels complémentaires, sans toucher au reste de l'UI.
          styles_path = Path("styles.css")
          styles = styles_path.read_text(encoding="utf-8")
          marker = "/* Minihi categorical map legend */"
          if marker not in styles:
              styles += '''

          /* Minihi categorical map legend */
          .brand {
            text-decoration: none;
            cursor: pointer;
            transition: opacity 150ms ease;
          }

          .brand:hover {
            opacity: 0.86;
          }

          .brand:focus-visible {
            outline: 2px solid rgba(255, 255, 255, 0.78);
            outline-offset: 5px;
            border-radius: 4px;
          }

          .map-legend {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px 12px;
            max-width: 300px;
          }

          .map-legend span {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
          }

          .legend-swatch {
            width: 13px;
            height: 10px;
            border: 2px solid;
            border-radius: 3px;
            flex: 0 0 auto;
          }

          .legend-opah-ru { border-color: #34235f; background: rgba(70, 50, 126, 0.28); }
          .legend-pig { border-color: #27466e; background: rgba(54, 92, 141, 0.28); }
          .legend-opah-d { border-color: #147b68; background: rgba(31, 161, 135, 0.28); }
          .legend-popac { border-color: #328c50; background: rgba(74, 193, 109, 0.28); }
          '''
          styles_path.write_text(styles, encoding="utf-8")

          # 5. README réécrit selon le cadrage produit convenu.
          readme = '''# Minihi

          Prototype web de préqualification d’un logement à partir de son adresse.

          Minihi permet de consulter l’éligibilité d’un logement à un dispositif
          d’accompagnement — rénovation, réhabilitation ou restauration — et de
          rassembler dans une même interface les principales informations disponibles
          sur les caractéristiques, l’enveloppe et le contexte du bâtiment.

          **Prototype de démonstration — © Bien Rurbaine 2026 — Tous droits réservés.
          Réutilisation ou redistribution sans autorisation interdite.**

          ## Démonstrateur

          [Ouvrir Minihi-lab](https://bienurbaine.github.io/Minihi-lab/)

          ## Fonctionnalités

          - recherche d’adresse via BAN / Géoplateforme (IGN) ;
          - localisation dans les opérations programmées de l’Anah en cours en Bretagne lorsque la source fournit un périmètre géographique exploitable ;
          - distinction cartographique des principaux types d’opérations (OPAH-RU, PIG, OPAH-D, POPAC) ;
          - affichage du dispositif, de sa période et de son maître d’ouvrage ;
          - consultation des zonages territoriaux intégrés au prototype ;
          - rapprochement avec la BDNB Open et affichage des principales informations disponibles sur le bâtiment : usage, année, DPE, GES, chauffage et copropriété ;
          - informations disponibles sur l’enveloppe : murs, planchers, toiture, vitrage, menuiseries et ventilation ;
          - éléments de contexte de rénovation : patrimoine, réseau de chaleur, solaire thermique et géothermie ;
          - cartographie Leaflet sur fond OpenStreetMap, avec mise en évidence de la Bretagne ;
          - vue Google Street View chargée à la demande pour l’adresse sélectionnée.

          ## Sources et périmètre

          Les principales sources mobilisées sont :

          - opérations programmées de l’Anah en cours : jeu « Liste des opérations programmées de l’Anah en cours et terminées » diffusé sur data.gouv.fr ;
          - BAN / Géoplateforme (IGN) pour la recherche d’adresse ;
          - DREAL Bretagne, ANCT et INSEE pour les zonages intégrés au prototype ;
          - BDNB Open pour les informations disponibles sur le bâtiment ;
          - API Découpage administratif (geo.api.gouv.fr) pour le contour régional utilisé par la carte.

          Le périmètre d’analyse est la Bretagne. La couverture cartographique des
          opérations Anah dépend de la présence d’une géométrie Polygon ou MultiPolygon
          exploitable dans la donnée source. Une opération sans géométrie n’est pas
          artificiellement reconstituée.

          ## Architecture

          Minihi est une application statique en HTML, CSS et JavaScript. Les données
          territoriales nécessaires au prototype sont stockées localement et chargées
          dans le navigateur. Les services externes sont interrogés uniquement pour les
          fonctions qui le nécessitent, notamment la recherche d’adresse, la BDNB et
          Street View.

          L’application est conçue pour être déployée comme un site web statique et peut
          également être testée via un serveur HTTP local.

          Le script `scripts/update_anah_perimeters.py` permet de régénérer
          `data/perimetres.geojson` à partir de la source nationale Anah en conservant
          les opérations actives en Bretagne, tous opérateurs confondus. Les quelques
          périmètres identifiés comme erronés dans la source sont explicitement exclus
          lors de cette préparation.

          ## Configuration de Google Street View

          Street View utilise Maps Embed API en mode `streetview`. La clé Google Maps
          Platform est isolée dans `streetview-config.js`.

          La clé doit être restreinte au domaine sur lequel Minihi est déployé et limitée
          à **Maps Embed API**. Pour des tests locaux, une origine `localhost` peut être
          autorisée temporairement puis retirée avant mise en production.

          Comme toute clé utilisée côté navigateur dans un site statique, elle reste
          visible dans le code : les restrictions de domaine et d’API sont donc
          indispensables. L’iframe Street View n’est chargée qu’à l’ouverture du panneau.
          '''
          readme = "\n".join(line[10:] if line.startswith("          ") else line for line in readme.splitlines()).strip() + "\n"
          Path("README.md").write_text(readme, encoding="utf-8")
          PY
      - name: Validate changed files
        run: |
          python -m json.tool data/bretagne.geojson >/dev/null
          python -m json.tool data/perimetres.geojson >/dev/null
          grep -q 'OPAH-RU' app.js
          grep -q 'regionMaskPane' app.js
          grep -q 'href="./"' index.html
          grep -q 'Prototype web de préqualification' README.md
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html styles.css README.md data/bretagne.geojson
          git commit -m "Améliore la lecture cartographique de Minihi"
          git push
