name: Minihi UI batch once

on:
  push:
    paths:
      - ".github/workflows/minihi-ui-batch-once.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Apply targeted Minihi changes
        run: python scripts/apply_ui_batch.py
      - name: Validate changed files
        run: |
          python -m json.tool data/bretagne.geojson >/dev/null
          python -m json.tool data/perimetres.geojson >/dev/null
          grep -q 'OPAH-RU' app.js
          grep -q 'regionMaskPane' app.js
          grep -q 'href="./"' index.html
          grep -q 'Prototype web de préqualification' README.md
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html styles.css README.md data/bretagne.geojson
          git commit -m "Améliore la lecture cartographique de Minihi"
          git push
