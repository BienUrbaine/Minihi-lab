name: Envelope labels once

on:
  push:
    paths:
      - ".github/workflows/envelope-labels-once.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Improve envelope values typography
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"Motif introuvable pour {label}")
              return text.replace(old, new, 1)

          bdnb_path = Path("bdnb.js")
          bdnb = bdnb_path.read_text(encoding="utf-8")
          old = '''  function envelopeValue(value, fallback) {
    if (!availableValue(value)) return fallback;
    const text = String(value).trim();
    return /^inconnue?$/i.test(text) ? fallback : text;
  }
'''
          new = '''  function envelopeValue(value, fallback) {
    if (!availableValue(value)) return fallback;
    const rawText = String(value).trim();
    if (/^inconnue?$/i.test(rawText)) return fallback;

    const accentCorrections = [
      [/\\bnon isole\\b/gi, "non isolé"],
      [/\\bisole\\b/gi, "isolé"],
      [/\\bmecanique\\b/gi, "mécanique"],
      [/\\breglable\\b/gi, "réglable"],
      [/\\bapres\\b/gi, "après"],
      [/\\binterieur\\b/gi, "intérieur"],
      [/\\bexterieur\\b/gi, "extérieur"],
      [/\\bmetal\\b/gi, "métal"],
    ];

    let text = accentCorrections.reduce(
      (current, [pattern, replacement]) => current.replace(pattern, replacement),
      rawText,
    );
    text = text.replace(/\\bpvc\\b/gi, "PVC");
    return text.charAt(0).toLocaleUpperCase("fr-FR") + text.slice(1);
  }
'''
          bdnb = replace_once(bdnb, old, new, "envelopeValue")
          bdnb_path.write_text(bdnb, encoding="utf-8")

          index_path = Path("index.html")
          index = index_path.read_text(encoding="utf-8")
          index = replace_once(index, "./bdnb.js?v=20260901-5", "./bdnb.js?v=20260901-6", "cache BDNB")
          index_path.write_text(index, encoding="utf-8")
          PY
      - name: Validate JavaScript syntax
        run: node --check bdnb.js
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bdnb.js index.html
          git diff --cached --check
          git commit -m "Soigne la typographie des informations d’enveloppe"
          git push
