name: Regenerate ANAH perimeters once

on:
  push:
    paths:
      - ".github/workflows/regenerate-anah-once.yml"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Regenerate perimeter data
        run: python scripts/update_anah_perimeters.py
      - name: Commit regenerated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/perimetres.geojson
          if git diff --cached --quiet; then
            echo "No perimeter change to commit."
          else
            git commit -m "Retire trois périmètres ANAH erronés"
            git push
          fi
